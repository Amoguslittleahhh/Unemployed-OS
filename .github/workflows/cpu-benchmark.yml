name: CPU benchmark (temporary, one-off)

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: CPU info
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          lscpu || true
      - name: openssl speed sha256
        run: openssl speed -seconds 3 sha256
