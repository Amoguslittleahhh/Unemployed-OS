# SECURITY: PXE/NBD/NFS/HTTP netboot has no authentication for the kernel
# and initramfs payloads fetched here -- cms_verify=y only covers verifying
# the *rootfs* signature after boot, not these pre-root LINUX/INITRD
# transfers themselves. There is no generic fix for this from the ISO side:
# it requires either a full UEFI Secure Boot + signed shim/kernel chain (not
# set up here) or restricting whoever serves these files to a trusted,
# isolated network segment where an on-path attacker swapping the kernel/
# initramfs isn't a realistic threat. Only serve these paths on a network
# you control end-to-end (Unemployed OS issue #6).
LABEL arch_nbd
TEXT HELP
Boot the Unemployed OS install medium using NBD.
It allows you to install Unemployed OS or perform system maintenance.
ENDTEXT
MENU LABEL Unemployed OS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
Boot the Unemployed OS live medium using NFS.
It allows you to install Unemployed OS or perform system maintenance.
ENDTEXT
MENU LABEL Unemployed OS install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

LABEL arch_http
TEXT HELP
Boot the Unemployed OS live medium using HTTP.
It allows you to install Unemployed OS or perform system maintenance.
ENDTEXT
MENU LABEL Unemployed OS install medium (%ARCH%, HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archiso_http_srv=http://${pxeserver}/ cms_verify=y
SYSAPPEND 3
