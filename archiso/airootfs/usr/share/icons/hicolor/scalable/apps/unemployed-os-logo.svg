<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Unemployed OS distro mark, "Terminal Zero": a shell prompt caret
       feeding into a zero (0 jobs, 0 employer), styled like a rounded
       terminal glyph. Fixed accent color (not currentColor) -- this file
       is the general "distro logo" consumed by about dialogs,
       GRUB/Calamares branding, etc., which don't apply panel theming to
       it. See unemployed-os-logo-symbolic.svg for the theme-aware
       panel/menu variant. Design rationale/alternates: docs in the
       branding review (chosen over "Power U", which read as a generic
       power button, and the briefcase concept, which loses detail below
       ~32px). -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#ff7a3c" stroke-width="4" opacity="0.25"/>
  <path d="M 24 36 L 40 50 L 24 64" fill="none" stroke="#ff7a3c"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="66" cy="50" rx="14" ry="20" fill="none" stroke="#ff7a3c" stroke-width="8"/>
  <line x1="58" y1="36" x2="74" y2="64" stroke="#ff7a3c" stroke-width="6" stroke-linecap="round"/>
</svg>
