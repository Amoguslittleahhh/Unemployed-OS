# extensions: dock
# macOS-like -- default GNOME top bar (not dash-to-panel), a bottom dock
# (dash-to-dock) with auto-hide off and window buttons on the left, like
# macOS's traffic-light close/minimize/maximize placement.
[org/gnome/desktop/interface]
color-scheme='default'
icon-theme='Papirus'

[org/gnome/desktop/wm/preferences]
button-layout='close,minimize,maximize:'

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dash-max-icon-size=48
dock-fixed=true
autohide=false
extend-height=false
transparency-mode='DYNAMIC'
