# extensions: panel
# Windows 11-like (default) -- bottom taskbar, centered icons, Redmond
# start menu. Matches archiso/airootfs/etc/dconf/db/local.d's own default,
# reproduced here so switching back to it after trying another layout
# works the same way as picking any other one.
[org/gnome/desktop/interface]
color-scheme='prefer-dark'
icon-theme='Papirus-Dark'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/shell/extensions/dash-to-panel]
panel-positions='{"0":"BOTTOM"}'
panel-sizes='{"0":48}'
panel-anchors='{"0":"MIDDLE"}'
appicon-margin=8
appicon-padding=4
show-favorites=true
show-running-apps=true
intellihide=false
taskbar-position='CENTEREDMONITOR'

[org/gnome/shell/extensions/arc-menu]
menu-layout='Redmond'
menu-button-icon-type='Distro_Icon'
position-in-panel='Left'
