# extensions: panel
# ChromeOS-like -- bottom shelf, centered, light theme, minimal icon
# spacing closer to the flat/minimal Chrome OS shelf look.
[org/gnome/desktop/interface]
color-scheme='default'
icon-theme='Papirus'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gnome/shell/extensions/dash-to-panel]
panel-positions='{"0":"BOTTOM"}'
panel-sizes='{"0":40}'
panel-anchors='{"0":"MIDDLE"}'
appicon-margin=6
appicon-padding=2
show-favorites=true
show-running-apps=true
intellihide=true
taskbar-position='CENTEREDMONITOR'

[org/gnome/shell/extensions/arc-menu]
menu-layout='Redmond'
menu-button-icon-type='Distro_Icon'
position-in-panel='Center'
