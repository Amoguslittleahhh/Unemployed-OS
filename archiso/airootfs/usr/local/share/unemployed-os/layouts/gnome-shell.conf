# extensions: none
# GNOME Shell-like -- stock GNOME Shell, no taskbar or dock extension at
# all. Top bar + Activities overview only, exactly as upstream GNOME
# ships it.
[org/gnome/desktop/interface]
color-scheme='default'
icon-theme='Adwaita'

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
