# extensions: dock
# elementary OS-like -- default GNOME top bar, a small floating auto-hide
# bottom dock (not full-height, not fixed), closer to elementary's Plank
# dock than a full taskbar.
[org/gnome/desktop/interface]
color-scheme='default'
icon-theme='Papirus'

[org/gnome/desktop/wm/preferences]
button-layout='close:minimize,maximize'

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
dash-max-icon-size=40
dock-fixed=false
autohide=true
extend-height=false
transparency-mode='FIXED'
