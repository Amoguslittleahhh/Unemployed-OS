# plymouth sits right after udev (needs it for the framebuffer/DRM device
# before it can draw) and before kms takes the console -- this is the live
# ISO's own boot splash (unemployed-os theme, set as default by
# customize_airootfs.sh). The installed system's initramfs is a separate
# mkinitcpio.conf built by Calamares' initcpiocfg module, which only
# supports prepend/append (not mid-list insertion) -- see that module's
# config for the resulting ordering caveat there.
HOOKS=(base udev plymouth microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
