# Unemployed OS unpackfs config. Source path matches this profile's
# archiso install_dir ("uos", set in archiso/profiledef.sh) and arch
# (x86_64) -- archiso mounts the boot medium at /run/archiso/bootmnt and
# the live squashfs lives at <bootmnt>/<install_dir>/<arch>/airootfs.sfs.
---
unpack:
    -   source: "/run/archiso/bootmnt/uos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
