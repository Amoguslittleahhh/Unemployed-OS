# Unemployed OS: enable the services our packages.x86_64 actually ships
# (GNOME/GDM + NetworkManager), disable the live-only unit that has no
# business surviving onto an installed system.
---
services:
  - name: "NetworkManager"
    mandatory: true
  - name: "gdm"
    mandatory: true
  - name: "bluetooth"
    mandatory: false
  - name: "cups"
    mandatory: false
  - name: "systemd-timesyncd"
    mandatory: false
  - name: "vboxservice"
    mandatory: false
  - name: "vmtoolsd"
    mandatory: false
  - name: "vmware-vmblock-fuse"
    mandatory: false

targets: []

disable:
  - name: "pacman-init"
    mandatory: false
  - name: "choose-mirror"
    mandatory: false

disable-targets: []

mask: []
