# Unemployed OS Calamares settings. Sequence and module list adapted from
# upstream Calamares' settings.conf (CC0-1.0), trimmed to what our
# packages.x86_64 actually installs (no ZFS, no LUKS-specific extras yet
# -- see docs/build-plan.md Part IX for the disk-encryption-by-default
# requirement, not yet wired here).
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - bootloader
  - umount
- show:
  - finished

branding: unemployedos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
