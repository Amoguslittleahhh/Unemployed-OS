# Unemployed OS Calamares settings. Sequence and module list adapted from
# upstream Calamares' settings.conf (CC0-1.0), trimmed to what our
# packages.x86_64 actually installs (no ZFS). LUKS encryption is available
# through partition.conf's normal "Encrypt system" flow (cryptsetup is in
# packages.x86_64); shellprocess@wire-luks-hook below covers the
# mkinitcpio/GRUB wiring Calamares' own modules can't express -- see
# docs/build-plan.md Part IX for the disk-encryption-by-default requirement
# this satisfies.
---
modules-search: [ local ]

instances:
- id:       fix-kernel-presets
  module:   shellprocess
  config:   shellprocess_fix_kernel_presets.conf
- id:       remove-live-user
  module:   shellprocess
  config:   shellprocess_remove_live_user.conf
- id:       wire-luks-hook
  module:   shellprocess
  config:   shellprocess_wire_luks.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # unpackfs just copied the live squashfs verbatim onto the target, which
  # includes the LIVE image's /etc/mkinitcpio.d/linux-zen.preset (the
  # "archiso" preset, meant for building the live boot image, not a
  # normal installed system) and its matching archiso.conf hook config.
  # Must run before initcpiocfg/initcpio or mkinitcpio builds a live-style
  # initramfs for the installed system instead of a normal one.
  - shellprocess@fix-kernel-presets
  # unpackfs also brought along the live-only "liveuser" account: NOPASSWD
  # sudo and GDM autologin included. Strip it so installs don't ship a
  # passwordless local admin account (see the shellprocess conf for detail).
  - shellprocess@remove-live-user
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  # Must run after fstab (so /etc/crypttab reflects any LUKS mapping the
  # partition step created) and before initcpiocfg/initcpio (so the
  # mkinitcpio HOOKS it edits are in place before the initramfs is built).
  - shellprocess@wire-luks-hook
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: unemployedos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
