# Replaces the live image's archiso-specific mkinitcpio preset (copied
# onto the target verbatim by unpackfs) with a normal installed-system
# preset before initcpiocfg/initcpio run. dontChroot: true runs this in
# the *live* environment, where ${ROOT} is the target mount point -- we
# need that, not a chroot, since we're writing files, not running mkinitcpio.
---
dontChroot: true
timeout: 30
script:
  - "cp ${ROOT}/root/postinstall-assets/linux-zen.preset ${ROOT}/etc/mkinitcpio.d/linux-zen.preset"
  - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
