# Unemployed OS bootloader config. Adapted from upstream Calamares'
# bootloader.conf (CC0-1.0). GRUB uses grub-mkconfig, which scans
# /boot for whatever kernels are actually installed (linux-zen today;
# linux-lts is planned per Part I of the plan but not yet bundled in the
# live squashfs -- see docs/build-plan.md and the README roadmap).
---
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "quiet", "splash" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
