# unpackfs copies the live rootfs verbatim onto the target, including the
# live-session-only "liveuser" account (passwordless, NOPASSWD sudo, GDM
# autologin -- see customize_airootfs.sh). Left in place, every install
# would ship a passwordless local admin account and autologin as it.
# dontChroot: false runs this *inside* the target chroot so `userdel`
# operates on the target's own user database, not the live session's.
---
dontChroot: false
timeout: 30
script:
  - "-userdel -r liveuser"
  - "rm -f /etc/sudoers.d/10-liveuser"
  - "rm -f /etc/gdm/custom.conf"
