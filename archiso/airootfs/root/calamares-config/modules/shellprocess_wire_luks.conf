# Wires up LUKS support (Unemployed OS issue #4): Calamares' own
# `initcpiocfg` module can only prepend/append mkinitcpio hooks at the very
# start or end of HOOKS -- but the "encrypt" hook has to sit between "block"
# and "filesystems" to actually be usable (it needs the raw block device
# from "block" and must run before "filesystems" tries to mount the
# decrypted volume). That ordering can't be expressed via prepend/append,
# so we do a targeted sed here instead, before initcpiocfg/initcpio run.
#
# Also sets GRUB_ENABLE_CRYPTODISK=y so grub-mkconfig emits the
# cryptomount lines an encrypted /boot (or GRUB needing to unlock the
# volume containing it) requires -- without this, LUKS installs build a
# GRUB config that can't actually reach an encrypted volume.
#
# Both edits are unconditional and harmless on a non-encrypted install:
# mkinitcpio's "encrypt" hook is a no-op without a cryptdevice= kernel
# param, and GRUB_ENABLE_CRYPTODISK=y with no encrypted volumes present
# just makes grub-mkconfig double-check for one and find none.
#
# dontChroot: true because this only needs to edit files under the target
# mount (${ROOT}), not run anything that needs the target's own binaries.
---
dontChroot: true
timeout: 30
script:
  - "sed -i 's/\\bblock\\b/block encrypt/' ${ROOT}/etc/mkinitcpio.conf"
  - "grep -q '^GRUB_ENABLE_CRYPTODISK=' ${ROOT}/etc/default/grub || echo 'GRUB_ENABLE_CRYPTODISK=y' >> ${ROOT}/etc/default/grub"
