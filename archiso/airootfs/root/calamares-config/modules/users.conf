# Unemployed OS user-creation config. Adapted from upstream Calamares'
# current users.conf (CC0-1.0) -- note the schema's shell setting lives
# under the nested `user:` key (`user.shell`), not the old flat
# `userShell` key some legacy Arch-spin configs (e.g. EndeavourOS) still
# carry from an earlier Calamares version.
---
defaultGroups:
  - wheel
  - rfkill
  - video
  - input
  - storage
  - optical
  - scanner
  - lp
  - audio

autoLoginGroup: autologin

doAutoLogin: false

sudoersGroup: wheel

setRootPassword: true

doReusePassword: true

# minLength: 1 only rejects empty passwords. libpwquality adds real
# strength requirements (matches allowWeakPasswords: false actually
# meaning something, since setRootPassword+doReusePassword means this
# same password becomes the root password too).
passwordRequirements:
  minLength: 8
  libpwquality:
    - minlen=8
    - minclass=2
    - maxrepeat=3

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /usr/bin/zsh
  forbidden_names: [ root ]
  home_permissions: "o700"

setHostname: EtcFile

writeHostsFile: true

presets:
  fullName:
    editable: true
  loginName:
    editable: true
  hostname:
    # Left blank on purpose: presetting the same value (e.g.
    # "unemployedos") on every install risks silent hostname collisions
    # on the same LAN for anyone who clicks through without typing one.
    editable: true
