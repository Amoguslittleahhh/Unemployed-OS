# Unemployed OS user-creation config. Adapted from upstream Calamares'
# users.conf (CC0-1.0) and EndeavourOS' users.conf for the group list.
---
defaultGroups:
  - wheel
  - rfkill
  - video
  - input
  - storage
  - optical
  - scanner
  - lp
  - audio

autoLoginGroup: autologin

doAutoLogin: false

sudoersGroup: wheel

setRootPassword: true

doReusePassword: true

passwordRequirements:
  minLength: 1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

userShell: /usr/bin/zsh

setHostname: EtcFile

writeHostsFile: true

presets:
  fullName:
    editable: true
  loginName:
    editable: true
  hostname:
    value: "unemployedos"
    editable: true
