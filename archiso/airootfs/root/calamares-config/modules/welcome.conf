# Unemployed OS welcome-page config.
# Adapted from upstream Calamares' src/modules/welcome/welcome.conf
# (SPDX-License-Identifier: CC0-1.0), trimmed to what we actually override.
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # Reference hardware in the plan is 8GB RAM / NVMe SSD (Part I), but
    # the installer's hard floor is lower than the recommended spec --
    # below this the live session itself won't be usable anyway.
    requiredStorage:    20.0
    requiredRam:        2.0
    internetCheckUrl:   http://example.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style:    "none"
