# Unemployed OS mount + Btrfs subvolume config. Adapted from upstream
# Calamares' mount.conf (CC0-1.0). This is what actually implements Part I
# of the plan: "Btrfs default, subvolumes @ @home @var @snapshots" --
# @var (not just @cache/@log) so a `timeshift`/snapper snapshot of @ can
# roll back without dragging /var/log or /var/cache along, and so /var
# survives a root rollback (needed for things like container/VM storage
# under /var/lib that shouldn't vanish on a system-snapshot restore).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var
      subvolume: /@var
    - mountPoint: /.snapshots
      subvolume: /@snapshots

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
