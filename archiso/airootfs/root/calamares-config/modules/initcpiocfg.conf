#
# The initcpiocfg module is responsible for the configuration of mkinitcpio.conf.  Typically this
# module is used in conjunction with the initcpio module to generate the boot image when using mkinitcpio
---
#
# Determines if the systemd versions of the hooks should be used.  This is false by default.
#
# Please note that using the systemd hooks result in no access to the emergency recovery shell
useSystemdHook: false

#
# Modifications to the standard list of hooks.
#
# There are three subkeys:
# - prepend, which puts hooks at the beginning of the
#   list of hooks, in the order specified here,
# - append, which adds hooks at the end of the list of
#   hooks, in the order specified here,
# - remove, which removes hooks from the list of hooks,
#   wherever they may be.
#
# archiso/packages.x86_64's mkinitcpio ships with the default
# HOOKS=(base udev autodetect microcode modconf kms keyboard keymap
# consolefont block filesystems fsck), and this module's own hooks: key is
# intentionally left empty here -- rather than the unmodified upstream
# example's placeholder "bogus" hook (which would have literally landed in
# the installed system's /etc/mkinitcpio.conf on every install) -- because
# initcpiocfg can only replace the whole HOOKS list wholesale, not splice a
# hook into a specific position. When the user opts into disk encryption,
# shellprocess_wire_luks.conf (see that file) runs *before* this module and
# inserts the "encrypt" hook directly into the target's mkinitcpio.conf, so
# by the time initcpiocfg runs its empty prepend/append/remove here leaves
# that already-inserted hook untouched instead of overwriting it.
# plymouth needs the same mid-list positioning as encrypt (right after
# udev, not tacked onto either end) to actually cover early boot messages
# and any LUKS passphrase prompt -- this module's prepend/append/remove
# API can't express that any more than it could express encrypt's own
# position requirement. So it's handled the same way: inserted directly
# by shellprocess_wire_luks.conf (see that file) before this module runs,
# right after "udev" and ahead of "encrypt". This module's hooks: key
# stays empty -- there's nothing left for it to add.
hooks:
    prepend: []
    append: []
    remove: []

#
# In some cases, you may want to use a different source
# file than /etc/mkinitcpio.conf , e.g. because the live system
# does not match the target in a useful way. If unset or
# empty, defaults to /etc/mkinitcpio.conf
#
source: "/etc/mkinitcpio.conf"
