# Unemployed OS unpackfs config. Source path matches this profile's
# archiso install_dir ("uos", set in archiso/profiledef.sh) and arch
# (x86_64) -- archiso mounts the boot medium at /run/archiso/bootmnt and
# the live squashfs lives at <bootmnt>/<install_dir>/<arch>/airootfs.sfs.
---
unpack:
    -   source: "/run/archiso/bootmnt/uos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        exclude:
            # Live-only power policy: installed laptops should still
            # suspend on lid-close, unlike the live session.
            - "etc/systemd/logind.conf.d/do-not-suspend.conf"
            # Live session's permissive SSH policy (password + root
            # login allowed) has no business surviving onto an install
            # where sshd is disabled by default anyway (services-systemd.conf).
            - "etc/ssh/sshd_config.d/10-archiso.conf"
