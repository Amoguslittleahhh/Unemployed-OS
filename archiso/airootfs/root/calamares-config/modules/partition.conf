# Unemployed OS partitioning defaults. Adapted from upstream Calamares'
# partition.conf (CC0-1.0). Default filesystem is Btrfs per Part I of the
# plan -- subvolume layout itself lives in mount.conf.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Swap-to-file on the @swap Btrfs subvolume (see mount.conf) rather than a
# dedicated swap partition -- avoids fixed-size swap partitions that are
# awkward to resize later, matches modern Fedora/openSUSE practice.
userSwapChoices:
    - file
    - small
    - suspend
    - none

drawNestedPartitions:   false
alwaysShowPartitionLabels: true

initialPartitioningChoice: none
initialSwapChoice: file

defaultFileSystemType:  "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
