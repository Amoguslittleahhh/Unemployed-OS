# Unemployed OS: enable the services our packages.x86_64 actually ships
# (GNOME/GDM + NetworkManager), disable the live-only units that have no
# business surviving onto an installed system. sshd is left installed
# (useful for headless/remote admin) but off by default -- the live
# image's permissive password+root-login policy (10-archiso.conf) is
# also stripped by unpackfs.conf's exclude list, so if a user does
# enable it later, it isn't inheriting live-session settings.
---
services:
  - name: "NetworkManager"
    mandatory: true
  - name: "gdm"
    mandatory: true
  - name: "bluetooth"
    mandatory: false
  - name: "cups"
    mandatory: false
  - name: "systemd-timesyncd"
    mandatory: false
  - name: "vboxservice"
    mandatory: false
  - name: "vmtoolsd"
    mandatory: false
  - name: "vmware-vmblock-fuse"
    mandatory: false

targets: []

disable:
  - name: "pacman-init"
    mandatory: false
  - name: "choose-mirror"
    mandatory: false
  - name: "livecd-talk"
    mandatory: false
  - name: "livecd-alsa-unmuter"
    mandatory: false
  - name: "sshd"
    mandatory: false

disable-targets: []

mask: []
